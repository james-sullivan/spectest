[project]
name = "spectest"
version = "0.1.0"
description = "Scripts for testing model compliance with specifications using value tradeoff scenarios"
authors = [
    { name = "James Sullivan" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
